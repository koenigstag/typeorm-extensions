name: Lint commit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 20 (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm clean-install

      - name: Run ESLint
        run: npm run lint