name: Test NestJS with library

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'test/nest*/**'
      - 'test/types/**'
      - '.github/workflows/test-nest.yml'

env:
  IS_CI: true
  TEST_WORKING_DIR: ${{ vars.TEST_WORKING_DIR }}
  GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
  SPANNER_EMULATOR_HOST: ${{ vars.SPANNER_EMULATOR_HOST }}

jobs:
  nest-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install nest dependencies
        run: npm clean-install
        working-directory: ${{ env.TEST_WORKING_DIR }}

      - name: Run build
        run: npm run build
        working-directory: ${{ env.TEST_WORKING_DIR }}

  nest-test:
    runs-on: ubuntu-latest
    needs: nest-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install nest dependencies
        run: npm clean-install
        working-directory: ${{ env.TEST_WORKING_DIR }}

      - name: Run tests
        run: npm run test
        working-directory: ${{ env.TEST_WORKING_DIR }}

  # the same suite on MySQL; the other jobs run it on SQLite
  nest-test-mysql:
    name: nest-test (mysql 8.4)
    runs-on: ubuntu-latest
    needs: nest-build
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_DRIVER: mysql
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: test
      DATABASE_NAME: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install nest dependencies
        run: npm clean-install
        working-directory: ${{ env.TEST_WORKING_DIR }}

      # one database for all suites, and each test drops the schema
      - name: Run tests
        run: npm run test -- --runInBand
        working-directory: ${{ env.TEST_WORKING_DIR }}

  # the peer range `^0.3.12 || ^1.0.0`: its lowest version and the latest 0.3.x and 1.x
  nest-test-typeorm:
    name: nest-test (typeorm ${{ matrix.typeorm }})
    runs-on: ubuntu-latest
    needs: nest-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - typeorm: '0.3.12'
            extra-packages: ''
            jest-config: jest.config.ts
          - typeorm: '^0.3'
            extra-packages: ''
            jest-config: jest.config.ts
          # TypeORM 1.x needs better-sqlite3 12; its config replaces @nestjs/typeorm, see jest.typeorm1.config.ts
          - typeorm: '^1'
            extra-packages: 'better-sqlite3@^12'
            jest-config: jest.typeorm1.config.ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install nest dependencies
        run: npm clean-install
        working-directory: ${{ env.TEST_WORKING_DIR }}

      - name: Install TypeORM ${{ matrix.typeorm }}
        run: |
          npm install --no-save --legacy-peer-deps "typeorm@${{ matrix.typeorm }}" ${{ matrix.extra-packages }}
          grep -m1 '"version"' node_modules/typeorm/package.json
        working-directory: ${{ env.TEST_WORKING_DIR }}

      - name: Run tests
        run: npm run test -- --config ${{ matrix.jest-config }}
        working-directory: ${{ env.TEST_WORKING_DIR }}

      - name: Type-check the library against TypeORM ${{ matrix.typeorm }}
        run: |
          npm install --no-save --legacy-peer-deps "typeorm@${{ matrix.typeorm }}"
          npx tsc -p . --noEmit

      - name: Type-test strictParams against TypeORM ${{ matrix.typeorm }}
        run: npm run test:types
